<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy Prompter</title>
    <meta
      name="description"
      content="Describe a task in a sentence and get back a structured prompt you can paste straight into ChatGPT, Claude, or Gemini."
    />
    <link rel="icon" href="/logo.jpg" type="image/jpeg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lazy Prompter" />
    <meta
      property="og:description"
      content="Describe a task in a sentence and get back a structured prompt you can paste straight into ChatGPT, Claude, or Gemini."
    />
    <meta property="og:url" content="https://lazyprompts.vercel.app" />
    <meta property="og:image" content="https://lazyprompts.vercel.app/logo.jpg" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Runs before first paint so the correct theme is already on <html>
      // when the first frame renders. A toggle added later would flash light.
      (() => {
        try {
          const stored = localStorage.getItem('theme') || 'system';
          const dark =
            stored === 'dark' ||
            (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch {
          /* localStorage blocked: fall through to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
